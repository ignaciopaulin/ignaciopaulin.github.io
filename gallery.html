<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gallery | Ignacio Paulin</title>
  <link rel="icon" type="image/png" href="guppy_circle.png" />
  <link rel="stylesheet" href="style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    /* Lightbox overlay styling */
    .lightbox-overlay {
      position: fixed;
      display: none;
      justify-content: center;
      align-items: center;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
    }

    .lightbox-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 90%;
      max-height: 90%;
    }

    .lightbox-overlay img {
      max-width: 90%;
      max-height: 90%;
      border: 4px solid white;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }

    .lightbox-caption {
      margin-top: 20px;
      max-width: 800px;
      color: #f5f5f5;
      font-family: "Courier New", Courier, monospace;
      font-size: 1rem;
      line-height: 1.6;
      text-align: left;
      background: rgba(0, 0, 0, 0.6);
      padding: 15px 20px;
      border-radius: 6px;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 30px;
      color: white;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.6);
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div class="name-top-left"><a href="index">Ignacio Paulin</a></div>
  
  <nav>
    <button class="nav-toggle" aria-label="Toggle navigation" onclick="
      document.getElementById('nav-menu').classList.toggle('open');
      this.classList.toggle('open');
    ">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <ul id="nav-menu">
      <li><a href="research">Research</a></li>
      <li><a href="cv">CV</a></li>
      <li><a href="outreach">Outreach</a></li>
      <li><a href="gallery">Gallery</a></li>
    </ul>
  </nav>

  <header class="banner" style="background-image: url('images/bg_td.jpg');">
    <div class="banner-text">
      <h2>Gallery</h2>
    </div>
  </header>

  <section class="about">
  <p>
    Apart from research, I enjoy capturing the natural world around me.  
    You can find more about my adventures on 
    <a href="https://www.instagram.com/ignaciopaulin/" target="_blank" rel="noopener noreferrer">@ignaciopaulin</a>.
  </p>
</section>

  <section class="gallery-grid">
    <img src="images/frog_web.jpg" alt="Giant treefrog" loading="lazy" />
    <img src="images/snake_web.jpg" alt="Machete snake" loading="lazy" />
    <img src="images/condor_web.jpg" alt="condor" loading="lazy" />
    <img src="images/mushrooms_web.jpg" alt="Mushrooms" loading="lazy" />
    <img src="images/blanchi_web.jpg" alt="Blanchisseuse" loading="lazy" />
    <img src="images/octopus_web.jpg" alt="Octopus" loading="lazy" />
    <img src="images/frog2_web.jpg" alt="Giant treefrog" loading="lazy"/>
    <img src="images/fish_web.jpg" alt="fish" loading="lazy" />
    <img src="images/mora_web.jpg" alt="mora" loading="lazy" />
    <img src="images/bayroad_web.jpg" alt="Bayroad" loading="lazy" />
    <img src="images/juvenile_web.jpg" alt="Unknown" loading="lazy" />
    <img src="images/condoreye_web.jpg" alt="condoreye" loading="lazy" />
    <img src="images/chingolo_web.jpg" alt="Chingolo" loading="lazy" />
    <img src="images/giraffe_web.jpg" alt="Giraffe" loading="lazy" />
    <img src="images/lilac_web.jpg" alt="Lilac-breasted roller" loading="lazy" />
  </section>

  <!-- Lightbox container -->
  <div class="lightbox-overlay" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">&times;</button>
    <img id="lightbox-img" src="" alt="Expanded image" />
  </div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const closeBtn = document.getElementById('lightbox-close');

     // Stories for each image (edit freely)
    const captions = {
      "frog_web.jpg": "A giant treefrog",
      "snake_web.jpg": "A machete snake crossing the river",
      "condor_web.jpg": "Views in la Quebrada",
      "mushrooms_web.jpg": "little fairy city",
      "blanchi_web.jpg": "Blanchisseuse ",
      "octopus_web.jpg": "How does having 8 arms feel like?",
      "frog2_web.jpg": "Another treefrog",
      "fish_web.jpg": "Can I touch it? ",
      "bayroad_web.jpg": "Bayroad just after rainfall.",
      "spider_web.jpg": "Crazy what eyes in frontal position can do",
      "chingolo_web.jpg": "pequeño pero matón",
      "giraffe_web.jpg": "I guess that as a kid you always want to see one",
      "lilac_web.jpg": "Lilac-breasted-always forget this last part of the name-roller"
    };

    // Image are clickable
    document.querySelectorAll('.gallery-grid img').forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightbox.style.display = 'flex';
      });
    });

    // Close with X
    closeBtn.addEventListener('click', () => {
      lightbox.style.display = 'none';
      lightboxImg.src = '';
    });

    // Close by clicking outside
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        lightbox.style.display = 'none';
        lightboxImg.src = '';
      }
    });
  </script>

</body>
</html>
